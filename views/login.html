<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول — لوحة التقارير</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --navy: #1D2F5F;
  --navy-light: #263a75;
  --orange: #FF6B2B;
  --orange-soft: #FFF0EA;
  --bg: #F4F6FA;
  --white: #FFFFFF;
  --gray: #4B5563;
  --gray-light: #9CA3AF;
  --border: #E5E7EB;
  --red: #dc2626;
  --shadow-md: 0 4px 20px rgba(29,47,95,0.14);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Cairo', sans-serif;
  background: var(--bg);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  direction: rtl;
}
.login-wrap {
  width: 100%;
  max-width: 420px;
  padding: 24px;
}
.login-logo {
  text-align: center;
  margin-bottom: 32px;
}
.login-logo .brand {
  display: inline-flex;
  align-items: center;
  gap: 10px;
}
.login-logo .icon {
  width: 48px; height: 48px;
  background: var(--navy);
  border-radius: 14px;
  display: flex; align-items: center; justify-content: center;
}
.login-logo .icon svg { width: 26px; height: 26px; fill: none; stroke: #fff; stroke-width: 2; }
.login-logo h1 {
  font-size: 20px;
  font-weight: 900;
  color: var(--navy);
  line-height: 1.2;
}
.login-logo p {
  font-size: 12px;
  color: var(--gray-light);
  margin-top: 2px;
  text-align: right;
}
.card {
  background: var(--white);
  border-radius: 16px;
  box-shadow: var(--shadow-md);
  padding: 32px;
  border-top: 4px solid var(--orange);
}
.card h2 {
  font-size: 18px;
  font-weight: 800;
  color: var(--navy);
  margin-bottom: 6px;
}
.card .sub {
  font-size: 13px;
  color: var(--gray-light);
  margin-bottom: 28px;
}
.form-group {
  margin-bottom: 18px;
}
.form-group label {
  display: block;
  font-size: 13px;
  font-weight: 700;
  color: var(--navy);
  margin-bottom: 7px;
}
.form-group input {
  width: 100%;
  padding: 11px 14px;
  border: 1.5px solid var(--border);
  border-radius: 10px;
  font-family: 'Cairo', sans-serif;
  font-size: 14px;
  color: var(--gray);
  background: var(--bg);
  outline: none;
  transition: border-color .2s;
  direction: ltr;
  text-align: right;
}
.form-group input:focus { border-color: var(--navy); background: #fff; }
.btn-login {
  width: 100%;
  padding: 13px;
  background: var(--navy);
  color: #fff;
  border: none;
  border-radius: 10px;
  font-family: 'Cairo', sans-serif;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  transition: background .2s;
  margin-top: 8px;
}
.btn-login:hover { background: var(--navy-light); }
.btn-login:active { transform: scale(0.99); }
.error-msg {
  background: #fee2e2;
  color: #dc2626;
  border: 1px solid #fca5a5;
  border-radius: 8px;
  padding: 10px 14px;
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 18px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.footer-note {
  text-align: center;
  font-size: 12px;
  color: var(--gray-light);
  margin-top: 20px;
}
.footer-note span { color: var(--orange); font-weight: 700; }
</style>
</head>
<body>
<div class="login-wrap">
  <div class="login-logo">
    <div class="brand">
      <div class="icon">
        <svg viewBox="0 0 24 24"><path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
      </div>
      <div>
        <h1>لوحة التقارير</h1>
        <p>خبراء التسويق</p>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>أهلاً بك 👋</h2>
    <p class="sub">سجّل دخولك للوصول لتقاريرك</p>

    <div id="errorMsg" class="error-msg" style="display:none">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      الإيميل أو كلمة المرور غلط
    </div>

    <form method="POST" action="/login">
      <div class="form-group">
        <label>البريد الإلكتروني</label>
        <input type="email" name="email" placeholder="example@reports.com" required autocomplete="email">
      </div>
      <div class="form-group">
        <label>كلمة المرور</label>
        <input type="password" name="password" placeholder="••••••••" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn-login">دخول ←</button>
    </form>
  </div>

  <p class="footer-note">مدعوم بـ <span>خبراء التسويق</span> © 2024</p>
</div>

<script>
  if (window.location.search.includes('error=1')) {
    document.getElementById('errorMsg').style.display = 'flex';
  }
</script>
</body>
</html>
