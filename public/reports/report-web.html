<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💻 تقرير Web Team — خبراء التسويق</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>:root {
  --navy: #1D2F5F;
  --navy-light: #263a75;
  --orange: #FF6B2B;
  --orange-soft: #FFF0EA;
  --bg: #F4F6FA;
  --white: #FFFFFF;
  --gray: #4B5563;
  --gray-light: #9CA3AF;
  --border: #E5E7EB;
  --green: #16a34a;
  --green-soft: #dcfce7;
  --yellow: #d97706;
  --yellow-soft: #fef3c7;
  --red: #dc2626;
  --red-soft: #fee2e2;
  --shadow: 0 2px 8px rgba(29,47,95,0.09);
  --shadow-md: 0 4px 20px rgba(29,47,95,0.14);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif;
  background: var(--bg);
  color: var(--gray);
  direction: rtl;
  text-align: right;
  min-height: 100vh;
  font-size: 14px;
  line-height: 1.65;
}
/* Header */
.rpt-header {
  background: var(--white);
  border-bottom: 3px solid var(--orange);
  box-shadow: var(--shadow-md);
  padding: 0;
  position: sticky; top: 0; z-index: 100;
}
.rpt-header-inner {
  max-width: 960px; margin: 0 auto;
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 28px; gap: 16px;
}
.rpt-logo { height: 40px; width: auto; }
.rpt-titles { flex: 1; }
.rpt-team-name { font-size: 18px; font-weight: 900; color: var(--navy); line-height: 1.2; }
.rpt-subtitle { font-size: 11.5px; color: var(--gray-light); margin-top: 2px; }
.rpt-week-badge {
  background: var(--navy); color: #fff;
  font-size: 11px; font-weight: 700;
  padding: 5px 14px; border-radius: 20px;
  white-space: nowrap;
}
/* Week selector */
.week-bar {
  max-width: 960px; margin: 18px auto 0; padding: 0 28px;
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
}
.week-bar label { font-size: 13px; font-weight: 700; color: var(--navy); }
.week-bar input[type=date], .week-bar input[type=text] {
  font-family: 'Cairo', sans-serif; font-size: 13px;
  border: 1.5px solid var(--border); border-radius: 8px;
  padding: 7px 12px; outline: none; color: var(--gray);
  background: var(--white); transition: border-color .2s;
}
.week-bar input:focus { border-color: var(--navy); }
/* Body */
.rpt-body { max-width: 960px; margin: 22px auto 60px; padding: 0 28px; display: flex; flex-direction: column; gap: 22px; }
/* Section card */
.section-card {
  background: var(--white); border-radius: 14px;
  border: 1.5px solid var(--border); box-shadow: var(--shadow);
  overflow: hidden;
}
.section-head {
  background: var(--navy); color: #fff;
  padding: 13px 20px; display: flex; align-items: center; gap: 10px;
}
.section-head .s-icon { font-size: 18px; }
.section-head .s-title { font-size: 15px; font-weight: 800; }
.section-head .s-subtitle { font-size: 11px; color: rgba(255,255,255,0.65); margin-top: 1px; }
.section-body { padding: 18px 20px; display: flex; flex-direction: column; gap: 14px; }
/* Field */
.field-row { display: flex; flex-direction: column; gap: 5px; }
.field-label { font-size: 12px; font-weight: 700; color: var(--navy); }
.field-hint { font-size: 11px; color: var(--gray-light); margin-top: 1px; }
.field-input {
  font-family: 'Cairo', sans-serif; font-size: 13.5px;
  border: 1.5px solid var(--border); border-radius: 9px;
  padding: 9px 13px; outline: none; color: var(--gray);
  background: var(--white); transition: border-color .2s; width: 100%;
  resize: vertical; direction: rtl;
}
.field-input:focus { border-color: var(--orange); }
textarea.field-input { min-height: 72px; }
/* Numbers grid */
.numbers-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.number-field { background: var(--bg); border-radius: 10px; padding: 10px 12px; border: 1.5px solid var(--border); }
.number-field label { font-size: 11px; font-weight: 700; color: var(--navy); display: block; margin-bottom: 4px; }
.number-field input {
  font-family: 'Cairo', sans-serif; font-size: 16px; font-weight: 800; color: var(--navy);
  border: none; outline: none; background: transparent; width: 100%; direction: rtl;
}
/* Status row */
.status-row { display: flex; gap: 10px; flex-wrap: wrap; }
.status-btn {
  flex: 1; min-width: 80px; padding: 10px 8px; border-radius: 10px;
  border: 2px solid var(--border); background: var(--white);
  font-family: 'Cairo', sans-serif; font-size: 13px; font-weight: 700;
  cursor: pointer; transition: all .18s; text-align: center;
}
.status-btn.green.active { background: var(--green-soft); border-color: var(--green); color: var(--green); }
.status-btn.yellow.active { background: var(--yellow-soft); border-color: var(--yellow); color: var(--yellow); }
.status-btn.red.active { background: var(--red-soft); border-color: var(--red); color: var(--red); }
.status-btn:not(.active):hover { border-color: var(--gray-light); }
/* Items list */
.items-list { display: flex; flex-direction: column; gap: 8px; }
.item-row { display: flex; gap: 8px; align-items: flex-start; }
.item-row .field-input { flex: 1; min-height: 0; padding: 8px 11px; }
.item-row .status-select {
  font-family: 'Cairo', sans-serif; font-size: 12px; font-weight: 700;
  border: 1.5px solid var(--border); border-radius: 8px; padding: 7px 10px;
  outline: none; background: var(--white); color: var(--gray); cursor: pointer;
}
.add-row-btn {
  font-family: 'Cairo', sans-serif; font-size: 12px; font-weight: 700;
  color: var(--navy); background: transparent; border: 1.5px dashed var(--border);
  border-radius: 9px; padding: 8px 14px; cursor: pointer; width: 100%;
  transition: all .18s; margin-top: 4px;
}
.add-row-btn:hover { border-color: var(--orange); color: var(--orange); background: var(--orange-soft); }
.remove-btn {
  background: transparent; border: 1.5px solid var(--border); border-radius: 7px;
  width: 30px; height: 34px; cursor: pointer; color: var(--gray-light);
  font-size: 14px; display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; transition: all .15s;
}
.remove-btn:hover { border-color: var(--red); color: var(--red); background: var(--red-soft); }
/* Scorecard */
.scorecard-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.score-cell {
  background: var(--bg); border-radius: 10px; padding: 12px;
  border: 1.5px solid var(--border); text-align: center;
}
.score-cell .sc-label { font-size: 11px; color: var(--gray-light); font-weight: 600; margin-bottom: 8px; }
.score-toggle { display: flex; gap: 6px; justify-content: center; }
.score-toggle button {
  font-family: 'Cairo', sans-serif; font-size: 12px; font-weight: 700;
  padding: 5px 10px; border-radius: 7px; border: 1.5px solid var(--border);
  background: var(--white); cursor: pointer; transition: all .15s;
}
.score-toggle button.yes.active { background: var(--green-soft); border-color: var(--green); color: var(--green); }
.score-toggle button.no.active { background: var(--red-soft); border-color: var(--red); color: var(--red); }
/* Actions */
.actions-bar {
  max-width: 960px; margin: 0 auto 30px; padding: 0 28px;
  display: flex; gap: 12px; flex-wrap: wrap;
}
.btn-primary {
  font-family: 'Cairo', sans-serif; font-size: 14px; font-weight: 800;
  background: var(--navy); color: #fff;
  border: none; border-radius: 10px; padding: 11px 24px; cursor: pointer;
  transition: background .18s; display: flex; align-items: center; gap: 7px;
}
.btn-primary:hover { background: var(--navy-light, #263a75); }
.btn-secondary {
  font-family: 'Cairo', sans-serif; font-size: 14px; font-weight: 700;
  background: var(--white); color: var(--navy);
  border: 1.5px solid var(--border); border-radius: 10px; padding: 11px 24px;
  cursor: pointer; transition: all .18s;
}
.btn-secondary:hover { border-color: var(--orange); color: var(--orange); }
.btn-danger {
  font-family: 'Cairo', sans-serif; font-size: 13px; font-weight: 700;
  background: var(--red-soft); color: var(--red);
  border: 1.5px solid var(--red); border-radius: 10px; padding: 11px 20px;
  cursor: pointer; transition: all .18s;
}
/* Save toast */
.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px);
  background: var(--navy); color: #fff;
  padding: 12px 24px; border-radius: 12px; font-size: 14px; font-weight: 700;
  box-shadow: 0 6px 24px rgba(29,47,95,0.25); transition: transform .3s; z-index: 999;
  display: flex; align-items: center; gap: 8px;
}
.toast.show { transform: translateX(-50%) translateY(0); }
/* Print */
@media print {
  .actions-bar, .week-bar { display: none !important; }
  .rpt-header { position: static; }
  .section-card { break-inside: avoid; }
  body { background: white; }
}
</style>

  <div class="rpt-titles"><div class="rpt-team-name">💻 تقرير Web Team</div><div class="rpt-subtitle">أمير · أحمد نصار</div></div>
  <div class="rpt-week-badge" id="weekBadge">الأسبوع الحالي</div>
</div></header>
<div class="week-bar">
  <label>أسبوع:</label>
  <input type="date" id="weekStart" onchange="updateWeekBadge();saveData()">
  <span style="color:var(--gray-light);font-size:13px;">إلى</span>
  <input type="date" id="weekEnd" onchange="updateWeekBadge();saveData()">
  <label style="margin-right:12px;">مقدّم التقرير:</label>
  <input type="text" id="reporterName" placeholder="أمير · أحمد نصار" style="width:220px;" oninput="saveData()">
</div>
<div class="rpt-body">
<div class="section-card">
  <div class="section-head"><span class="s-icon">📊</span><div><div class="s-title">Scorecard الأسبوع</div><div class="s-subtitle">تقييم الالتزام والمخرجات</div></div></div>
  <div class="section-body">
    <div class="scorecard-grid">
      <div class="score-cell"><div class="sc-label">التقرير مكتمل ومرسل؟</div><div class="score-toggle"><button class="yes" data-score="sc1" data-sval="yes" onclick="setScore('sc1','yes')">✅ نعم</button><button class="no" data-score="sc1" data-sval="no" onclick="setScore('sc1','no')">❌ لا</button></div></div>
      <div class="score-cell"><div class="sc-label">تم تحقيق المخرجات؟</div><div class="score-toggle"><button class="yes" data-score="sc2" data-sval="yes" onclick="setScore('sc2','yes')">✅ نعم</button><button class="no" data-score="sc2" data-sval="no" onclick="setScore('sc2','no')">❌ لا</button></div></div>
      <div class="score-cell"><div class="sc-label">حالة الفريق</div><div class="score-toggle"><button class="yes" data-score="sc3" data-sval="green" onclick="setScore('sc3','green')" style="color:var(--green)">🟢</button><button class="no" data-score="sc3" data-sval="yellow" onclick="setScore('sc3','yellow')" style="color:var(--yellow)">🟡</button><button class="no" data-score="sc3" data-sval="red" onclick="setScore('sc3','red')" style="color:var(--red)">🔴</button></div></div>
    </div>
  </div>
</div>
<div class="section-card">
  <div class="section-head"><span class="s-icon">🌐</span><div><div class="s-title">حالة مشاريع الويب</div></div></div>
  <div class="section-body">
    <div class="items-list" id="projects">
      <div class="item-row"><input class="field-input" placeholder="اسم المشروع / العميل" oninput="saveData()"><input class="field-input" placeholder="نسبة الإنجاز" style="max-width:120px" oninput="saveData()"><select class="status-select" onchange="saveData()"><option>🟢 في الموعد</option><option>🟡 تحتاج متابعة</option><option>🔴 متأخر / مشكلة</option></select><button class="remove-btn" onclick="this.parentElement.remove();saveData()">✕</button></div>
    </div>
    <button class="add-row-btn" id="addProject">+ إضافة مشروع</button>
  </div>
</div>
<div class="section-card">
  <div class="section-head"><span class="s-icon">⚙️</span><div><div class="s-title">المشاكل التقنية والدعم</div></div></div>
  <div class="section-body">
    <div class="numbers-grid">
      <div class="number-field"><label>مشاكل تم حلها</label><input type="number" id="n_solved" placeholder="0" oninput="saveData()"></div>
      <div class="number-field"><label>مشاكل مفتوحة</label><input type="number" id="n_open" placeholder="0" oninput="saveData()"></div>
      <div class="number-field"><label>مواقع تحتاج تدخل</label><input type="number" id="n_urgent" placeholder="0" oninput="saveData()"></div>
    </div>
    <div class="field-row" style="margin-top:12px"><div class="field-label">تفاصيل المشاكل المفتوحة</div><textarea class="field-input" id="open_issues" placeholder="اكتب تفاصيل المشاكل التقنية المفتوحة..." oninput="saveData()"></textarea></div>
    <div class="field-row"><div class="field-label">مدى جاهزية التتبع والتحويل للمواقع</div><textarea class="field-input" id="tracking_status" placeholder="هل التتبع مُركّب وشغال على كل المواقع؟" oninput="saveData()"></textarea></div>
  </div>
</div>
<div class="section-card">
  <div class="section-head"><span class="s-icon">🔑</span><div><div class="s-title">قرارات مطلوبة</div></div></div>
  <div class="section-body">
    <div class="items-list" id="decisions">
      <div class="item-row"><textarea class="field-input" placeholder="اكتب القرار المطلوب..." rows="2" oninput="saveData()"></textarea><select class="status-select" onchange="saveData()"><option>عاجل</option><option>هذا الأسبوع</option><option>الأسبوع القادم</option></select><button class="remove-btn" onclick="this.parentElement.remove();saveData()">✕</button></div>
    </div>
    <button class="add-row-btn" id="addDecision">+ إضافة قرار</button>
  </div>
</div></div>
<div class="actions-bar">
  <button class="btn-primary" onclick="saveData()">💾 حفظ التقرير</button>
  <button class="btn-secondary" onclick="window.print()">🖨️ طباعة / PDF</button>
  <button class="btn-danger" onclick="clearData()">🗑️ مسح البيانات</button>
</div>
<div class="toast" id="toast">✅ تم حفظ التقرير بنجاح</div>
<script>
const STORAGE_KEY = 'me_report_web';
function setScore(f,v){document.querySelectorAll('[data-score="'+f+'"]').forEach(b=>b.classList.remove('active'));const btn=document.querySelector('[data-score="'+f+'"][data-sval="'+v+'"]');if(btn)btn.classList.add('active');saveData();}
function addItemRow(cid,tpl){const c=document.getElementById(cid);const d=document.createElement('div');d.className='item-row';d.innerHTML=tpl+'<button class="remove-btn" onclick="this.parentElement.remove();saveData()">✕</button>';c.appendChild(d);}
function updateWeekBadge(){const s=document.getElementById('weekStart').value;const e=document.getElementById('weekEnd').value;if(s&&e){const ds=new Date(s).toLocaleDateString('ar-EG',{day:'numeric',month:'short'});const de=new Date(e).toLocaleDateString('ar-EG',{day:'numeric',month:'short',year:'numeric'});document.getElementById('weekBadge').textContent=ds+' — '+de;}}
function saveData(){const data={};document.querySelectorAll('input,textarea,select').forEach(el=>{if(el.id)data[el.id]=el.value;});document.querySelectorAll('[data-score].active').forEach(b=>{data['score_'+b.dataset.score]=b.dataset.sval;});localStorage.setItem(STORAGE_KEY,JSON.stringify(data));showToast();}
function showToast(){const t=document.getElementById('toast');t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);}
function clearData(){if(confirm('هل تريد مسح جميع البيانات؟')){localStorage.removeItem(STORAGE_KEY);location.reload();}}
window.addEventListener('DOMContentLoaded',()=>{
document.getElementById('addProject').onclick=()=>addItemRow('projects','<input class="field-input" placeholder="اسم المشروع / العميل" oninput="saveData()"><input class="field-input" placeholder="نسبة الإنجاز" style="max-width:120px" oninput="saveData()"><select class="status-select" onchange="saveData()"><option>🟢 في الموعد</option><option>🟡 تحتاج متابعة</option><option>🔴 متأخر / مشكلة</option></select>');
document.getElementById('addDecision').onclick=()=>addItemRow('decisions','<textarea class="field-input" placeholder="القرار المطلوب..." rows="2" oninput="saveData()"></textarea><select class="status-select" onchange="saveData()"><option>عاجل</option><option>هذا الأسبوع</option><option>الأسبوع القادم</option></select>');
const saved=localStorage.getItem(STORAGE_KEY);if(!saved)return;const data=JSON.parse(saved);Object.keys(data).forEach(key=>{if(key.startsWith('score_')){const f=key.replace('score_','');const v=data[key];const btn=document.querySelector('[data-score="'+f+'"][data-sval="'+v+'"]');if(btn)btn.classList.add('active');}else{const el=document.getElementById(key);if(el)el.value=data[key];}});updateWeekBadge();});
</script>
</body></html>
